<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 256" width="680" height="256" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>codex-relay flow</title>
  <desc>1 Claude calls create_thread on the bridge, 2 the bridge starts the turn on the Codex App Server, 3 the mod's hook sees the call and spawns a watcher, 4 the watcher waits on the bridge, 5 the App Server pushes turn/completed to the bridge, which answers the wait, 6 the watcher messages the answer to Claude.</desc>
  <style>
    .bg { fill: #ffffff; }
    .claude { fill: #FAECE7; stroke: #993C1D; }
    .codex { fill: #F1EFE8; stroke: #5F5E5A; }
    .claude-t { fill: #712B13; } .claude-s { fill: #993C1D; }
    .codex-t { fill: #444441; } .codex-s { fill: #5F5E5A; }
    .l { fill: #5F5E5A; }
    .cx { fill: #EEEDFE; stroke: #534AB7; }
    .cx-t { fill: #3C3489; } .cx-s { fill: #534AB7; }
    .a { stroke: #888780; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .d { stroke: #888780; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .claude { fill: #712B13; stroke: #F0997B; }
      .codex { fill: #444441; stroke: #B4B2A9; }
      .claude-t { fill: #FAECE7; } .claude-s { fill: #F5C4B3; }
      .codex-t { fill: #F1EFE8; } .codex-s { fill: #D3D1C7; }
      .l { fill: #B4B2A9; }
      .cx { fill: #3C3489; stroke: #AFA9EC; }
      .cx-t { fill: #EEEDFE; } .cx-s { fill: #CECBF6; }
    }
    .th { font-size: 14px; font-weight: 600; }
    .ts { font-size: 12px; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect class="bg" width="680" height="256"/>

  <rect class="claude" x="40" y="50" width="150" height="56" rx="8" stroke-width="0.75"/>
  <text class="th claude-t" x="115" y="69" text-anchor="middle" dominant-baseline="central">Claude</text>
  <text class="ts claude-s" x="115" y="88" text-anchor="middle" dominant-baseline="central">main or subagent</text>

  <rect class="codex" x="265" y="50" width="150" height="56" rx="8" stroke-width="0.75"/>
  <text class="th codex-t" x="340" y="69" text-anchor="middle" dominant-baseline="central">Bridge</text>
  <text class="ts codex-s" x="340" y="88" text-anchor="middle" dominant-baseline="central">MCP server</text>

  <rect class="cx" x="490" y="50" width="150" height="56" rx="8" stroke-width="0.75"/>
  <text class="th cx-t" x="565" y="69" text-anchor="middle" dominant-baseline="central">Codex App Server</text>
  <text class="ts cx-s" x="565" y="88" text-anchor="middle" dominant-baseline="central">runs the turn</text>

  <rect class="claude" x="40" y="170" width="375" height="56" rx="8" stroke-width="0.75"/>
  <text class="th claude-t" x="227" y="189" text-anchor="middle" dominant-baseline="central">Mod</text>
  <text class="ts claude-s" x="227" y="208" text-anchor="middle" dominant-baseline="central">Desktop band + a watcher subagent per turn</text>

  <rect class="cx" x="490" y="170" width="150" height="56" rx="8" stroke-width="0.75"/>
  <text class="th cx-t" x="565" y="189" text-anchor="middle" dominant-baseline="central">Codex app</text>
  <text class="ts cx-s" x="565" y="208" text-anchor="middle" dominant-baseline="central">full history</text>

  <line class="a" x1="192" y1="78" x2="261" y2="78"/>
  <text class="ts l" x="227" y="68" text-anchor="middle">1 call</text>
  <line class="a" x1="417" y1="68" x2="486" y2="68"/>
  <text class="ts l" x="452" y="58" text-anchor="middle">2 start</text>
  <line class="a" x1="488" y1="88" x2="419" y2="88"/>
  <text class="ts l" x="452" y="104" text-anchor="middle">5 done</text>
  <line class="a" x1="80" y1="108" x2="80" y2="166"/>
  <text class="ts l" x="88" y="141">3 hook</text>
  <line class="a" x1="150" y1="168" x2="150" y2="110"/>
  <text class="ts l" x="158" y="141">6 answer</text>
  <line class="a" x1="340" y1="168" x2="340" y2="110"/>
  <text class="ts l" x="348" y="141">4 wait</text>
  <line class="d" x1="565" y1="108" x2="565" y2="168"/>
  <text class="ts l" x="573" y="141">same thread</text>
</svg>
